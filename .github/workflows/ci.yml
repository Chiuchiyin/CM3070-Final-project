name: advisor-ci

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install runtime dependencies
        run: python -m pip install -r Code/advisor/requirements.txt
      - name: Compile production modules
        shell: pwsh
        run: python -m py_compile Code/stock-app/app-express.py Code/advisor/advisor/*.py
      - name: Run offline tests
        shell: pwsh
        env:
          PYTHONPATH: Code/advisor
        run: python -m unittest discover -s Code/advisor/tests -v
